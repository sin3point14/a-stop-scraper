name: Deploy to GitHub Pages & Daily Scraper

on:
  push:
    branches:
      - main
  schedule:
    # Run midnight scraper every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Daily Scraper (Runs on schedule or manual trigger)
  scrape-and-update:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_scraper == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ASTOP Scraper & Page Generator
        run: |
          python full_scraper.py
          python generate_pages.py

      - name: Commit updated dataset and shelf pages if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cases_data.json cases/
          if git diff --staged --quiet; then
            echo "No changes in dataset or shelf pages"
          else
            git commit -m "Auto-update dataset and shelf pages via midnight scraper [skip ci]"
            git push
          fi

  # Deploy Job (Runs on push, workflow_dispatch, or after scraping)
  deploy:
    runs-on: ubuntu-latest
    needs: [scrape-and-update]
    if: always() && !cancelled()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
