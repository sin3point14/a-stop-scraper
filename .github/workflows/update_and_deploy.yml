name: Daily Scrape & Deploy to GitHub Pages

on:
  schedule:
    # Run every day at midnight UTC (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ASTOP Scraper & Generate Shelf Pages
        run: |
          python full_scraper.py
          python generate_pages.py

      - name: Commit updated dataset and shelf pages if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cases_data.json cases/
          if git diff --staged --quiet; then
            echo "No changes in dataset or shelf pages"
          else
            git commit -m "Auto-update cases_data.json and shelf pages via midnight scraper [skip ci]"
            git push
          fi

  deploy:
    needs: scrape-and-update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
